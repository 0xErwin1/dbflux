name: Style

# Prose and the site cannot break a Rust build, and a change confined to them
# does not need the full matrix including the Docker-backed driver suites.
#
# That rule used to live in the `pull_request` trigger's paths-ignore. It moved
# into the `changes` job below on purpose: a workflow skipped by path filtering
# never starts, so its required status checks stay "Pending" forever and the
# pull request is unmergeable (see GitHub's "Troubleshooting required status
# checks"). A job skipped by a conditional reports "Success", so the workflow
# now always triggers and the jobs decide whether the Rust checks apply. The
# `push` trigger keeps its paths-ignore: a push run has no required checks to
# satisfy, so skipping it entirely still saves the compute.
#
# Markdown is safe to skip because no crate pulls it into the build: there is
# no `include_str!` of a .md file, no `#[doc = include_str!]`, and no `readme`
# key in any manifest. Re-check that before assuming it still holds.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# See the note in tests.yml: the group name must be a literal so a Release run
# and the reusable workflows it calls never share a concurrency group.
concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The base commit of the pull request has to be in the object store for
          # the diff below to resolve, and a shallow clone does not have it.
          fetch-depth: 0

      - name: Decide whether the Rust checks apply
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Decide first, write once. The output file is a list of name=value
          # lines, and writing the same name twice would make the result depend
          # on which duplicate the parser keeps, which the workflow-commands
          # reference does not specify. So this computes a single value and
          # appends a single line.
          #
          # The default is to run the Rust checks, and it is overridden only by
          # a confirmed finding that every changed path is prose or the site.
          # A broken resolver or a failed diff therefore costs extra CI time
          # rather than silently disabling the checks that gate this branch.
          rust=true

          # Everything that is not a pull request must run the Rust checks: this
          # workflow is also invoked through workflow_call from release.yml, where
          # there is no pull request to scope against.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if changed=$(git diff --name-only "$BASE_SHA" HEAD) && [ -n "$changed" ]; then
              # The rule the path filter used to apply, in one place: the Rust
              # checks are unnecessary only when every changed path is prose or
              # the site.
              if ! printf '%s\n' "$changed" | grep -qvE '^(web/|.*\.md$|\.github/workflows/web\.yml$)'; then
                rust=false
              fi
            else
              echo "::warning::cannot scope the change against $BASE_SHA; running the Rust checks"
            fi
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # NOTE: this job is duplicated in tests.yml. GitHub offers no way to share an
  # output between two workflows without a reusable workflow, and neither file
  # can be one (both are already workflow_call targets for release.yml). The two
  # copies must stay byte-identical except for surrounding indentation.

  # Fail-open gate: `always()` stops a failed `changes` job from skipping this
  # required check, and an unset output means "run the checks", not skip them.
  # On a confirmed docs-only change the job skips deliberately and reports
  # "Success", which satisfies the required "Formatting" context.
  fmt:
    name: Formatting
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    # Deliberately not matrixed, unlike clippy below: rustfmt parses whole
    # files, so it already formats cfg-gated code that never compiles here, and
    # a Windows checkout would only add line-ending noise.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Gated at the job level, unlike cross-platform-check in tests.yml: the
  # required "Clippy" context is carried by clippy-result below, not by these
  # matrix legs. Fail-open like every other gate: `always()` keeps this job
  # from being skipped when `changes` fails, so clippy-result only ever sees
  # success, failure, or a deliberate skip on a confirmed docs-only change.
  clippy:
    name: Clippy ${{ matrix.os }}
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # GPUI and the platform seams (keyring, IPC, windowing, process spawning)
    # carry a large amount of cfg-gated code that a Linux-only clippy run never
    # compiles, so lint debt could accumulate there unseen until a release
    # build. Lint every platform we ship instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extra_features: ""
          # Native arm64; vendored-openssl matches build.yml (the runner has no
          # pkg-config-discoverable OpenSSL, so openssl-sys must build it).
          - os: macos-14
            extra_features: ",vendored-openssl"
          # Native x86_64-msvc; OpenSSL is resolved on the runner as in build.yml.
          - os: windows-latest
            extra_features: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: clippy

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          # The external Chrome APT source is irrelevant to Rust CI and can fail independently.
          for chrome_source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$chrome_source" ]; then
              sudo mv -- "$chrome_source" "$chrome_source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          # Shared with the cross-platform check in tests.yml: both run the
          # same feature set against the same target dir on the same runner.
          shared-key: ci-check-${{ matrix.os }}
          cache-targets: true
          cache-on-failure: true

      - name: Run clippy
        run: cargo clippy --workspace --locked --features "sqlite,postgres,mysql,mssql,mongodb,redis,dynamodb,cloudwatch,influxdb,clickhouse,turso,aws,ui-automation${{ matrix.extra_features }}" -- -D warnings

  # Aggregate gate. `Clippy` is a required status check in the repository
  # ruleset, and a matrixed job reports one context per platform instead, so
  # this job keeps the required name alive and fails if any platform did.
  # A skipped matrix counts as a pass: clippy is gated on the change scope, so
  # "skipped" means the change set was prose or the site, nothing to lint.
  clippy-result:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: clippy
    if: always()

    steps:
      - name: Check matrix result
        env:
          RESULT: ${{ needs.clippy.result }}
        run: |
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "::error::Clippy did not pass on every platform (result: $RESULT)."
            exit 1
          fi

  # Same fail-open rationale as fmt above. Not a required check, but a
  # confirmed docs-only change should not spend a run scanning advisories.
  machete:
    name: Unused dependencies
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked

      - name: Check for unused dependencies
        run: cargo machete

  # Same fail-open rationale as fmt above.
  cargo-deny:
    name: Supply-chain advisories
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Non-blocking: advisory/license findings surface as annotations but never
      # gate a PR. Promote to gating by removing continue-on-error once the
      # advisory backlog is triaged.
      - name: Run cargo-deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2
        with:
          command: check advisories licenses bans sources
