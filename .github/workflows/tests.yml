name: Tests

# Prose and the site cannot break a Rust build, and a change confined to them
# does not need the full matrix including the Docker-backed driver suites.
#
# That rule used to live in the `pull_request` trigger's paths-ignore. It moved
# into the `changes` job below on purpose: a workflow skipped by path filtering
# never starts, so its required status checks stay "Pending" forever and the
# pull request is unmergeable (see GitHub's "Troubleshooting required status
# checks"). A job skipped by a conditional reports "Success", so the workflow
# now always triggers and the jobs decide whether the Rust checks apply. The
# `push` trigger keeps its paths-ignore: a push run has no required checks to
# satisfy, so skipping it entirely still saves the compute.
#
# Markdown is safe to skip because no crate pulls it into the build: there is
# no `include_str!` of a .md file, no `#[doc = include_str!]`, and no `readme`
# key in any manifest. Re-check that before assuming it still holds.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [main, dev]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The group name must be a literal, not ${{ github.workflow }}: under
# workflow_call that expression resolves to the *calling* workflow, so Release
# invoking tests.yml and style.yml would put both — and the Release run itself,
# whose group differs only by case — in one group and cancel them all.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The base commit of the pull request has to be in the object store for
          # the diff below to resolve, and a shallow clone does not have it.
          fetch-depth: 0

      - name: Decide whether the Rust checks apply
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Decide first, write once. The output file is a list of name=value
          # lines, and writing the same name twice would make the result depend
          # on which duplicate the parser keeps, which the workflow-commands
          # reference does not specify. So this computes a single value and
          # appends a single line.
          #
          # The default is to run the Rust checks, and it is overridden only by
          # a confirmed finding that every changed path is prose or the site.
          # A broken resolver or a failed diff therefore costs extra CI time
          # rather than silently disabling the checks that gate this branch.
          rust=true

          # Everything that is not a pull request must run the Rust checks: this
          # workflow is also invoked through workflow_call from release.yml, where
          # there is no pull request to scope against.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if changed=$(git diff --name-only "$BASE_SHA" HEAD) && [ -n "$changed" ]; then
              # The rule the path filter used to apply, in one place: the Rust
              # checks are unnecessary only when every changed path is prose or
              # the site.
              if ! printf '%s\n' "$changed" | grep -qvE '^(web/|.*\.md$|\.github/workflows/web\.yml$)'; then
                rust=false
              fi
            else
              echo "::warning::cannot scope the change against $BASE_SHA; running the Rust checks"
            fi
          fi

          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  # NOTE: this job is duplicated in style.yml. GitHub offers no way to share an
  # output between two workflows without a reusable workflow, and neither file
  # can be one (both are already workflow_call targets for release.yml). The two
  # copies must stay byte-identical except for surrounding indentation.

  # Fail-open gate: `always()` stops a failed `changes` job from skipping this
  # required check, and an unset output means "run the checks", not skip them.
  # On a confirmed docs-only change the job skips deliberately and reports
  # "Success", which satisfies the required "Deterministic Tests" context.
  deterministic-tests:
    name: Deterministic Tests
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Install system dependencies
        run: |
          # The external Chrome APT source is irrelevant to Rust CI and can fail independently.
          for chrome_source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$chrome_source" ]; then
              sudo mv -- "$chrome_source" "$chrome_source.disabled"
            fi
          done
          sudo apt-get update
          # The last five packages serve the vendored UI-automation MCP server
          # (vendor/gpui-mcp): its screen capture backend, xcap, links PipeWire,
          # libgbm, EGL and xcb-randr, and generates PipeWire bindings with bindgen.
          sudo apt-get install -y \
            mold \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libegl-dev \
            libxcb-randr0-dev \
            libclang-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: ci-deterministic
          cache-targets: true
          cache-on-failure: true
          # A cache saved from a pull request or a tag is scoped to that ref:
          # nothing else can read it, yet it counts toward the repository's
          # cache limit and evicts the caches main and the nightly rely on.
          # Pull requests and releases still restore from main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run deterministic workspace tests
        run: cargo test --workspace --locked --features "sqlite,postgres,mysql,mssql,mongodb,redis,dynamodb,cloudwatch,influxdb,clickhouse,turso,aws"

  # Same fail-open rationale as deterministic-tests above.
  driver-live-integration:
    name: Driver Live Integration
    needs: changes
    if: always() && needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Install system dependencies
        run: |
          # The external Chrome APT source is irrelevant to Rust CI and can fail independently.
          for chrome_source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$chrome_source" ]; then
              sudo mv -- "$chrome_source" "$chrome_source.disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          shared-key: ci-live-integration
          cache-targets: true
          cache-on-failure: true
          # Saved from main only; see the deterministic job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Testcontainers pulls images lazily at test time, so concurrent test
      # binaries race to pull the same tag and anonymous Docker Hub throttling
      # aborts mid-stream ("bytes remaining on stream"). Pulling everything
      # up front, serially and with retries, removes that failure mode.
      #
      # Most images come from mirror.gcr.io, Google's pull-through mirror of
      # Docker Hub: it has no per-IP rate limit and needs no credentials, so
      # it removes the throttling this step was built to survive and keeps
      # working on pull requests from forks. grokzen/redis-cluster is not
      # carried there and stays on Docker Hub.
      #
      # This step is an optimisation, not a gate, so it never fails the job.
      # It used to `exit 1` on the first image it could not fetch, which meant
      # one withdrawn image took down every driver suite — a dead MinIO tag
      # blocked PostgreSQL, MySQL, MongoDB, Redis and DynamoDB, none of which
      # use it, and blocked every pull request in the repository with it.
      # An image that cannot be pre-pulled is reported here and left to
      # testcontainers, so only the suite that actually needs it fails, and it
      # fails with a test error rather than a red job that ran no tests.
      - name: Pre-pull container images
        run: |
          images=(
            mirror.gcr.io/library/postgres:16
            mirror.gcr.io/pgvector/pgvector:0.8.0-pg16
            mirror.gcr.io/library/mysql:8.4
            mirror.gcr.io/library/mongo:7
            mirror.gcr.io/library/redis:7
            grokzen/redis-cluster:7.0.10
            mirror.gcr.io/clickhouse/clickhouse-server:25.8.30.16
            mcr.microsoft.com/mssql/server:2022-latest
            mirror.gcr.io/amazon/dynamodb-local:latest
            mirror.gcr.io/library/influxdb:2.7
            mirror.gcr.io/library/influxdb:1.8
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
            mirror.gcr.io/localstack/localstack:3
            ghcr.io/tursodatabase/libsql-server:v0.24.33
          )
          unpulled=()
          for image in "${images[@]}"; do
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "::warning::could not pre-pull $image after 3 attempts; \
          the suite that needs it will pull it at test time and fail there if it is genuinely gone"
                unpulled+=("$image")
                break
              fi
              sleep $((attempt * 15))
            done
          done

          if [ ${#unpulled[@]} -gt 0 ]; then
            echo "images left for testcontainers to pull: ${unpulled[*]}"
          fi

      - name: Run PostgreSQL live integration tests
        run: cargo test -p dbflux_driver_postgres --locked --test live_integration -- --ignored

      - name: Run Redshift execution-safety PostgreSQL protocol compatibility regression
        run: cargo test -p dbflux_driver_redshift --locked --test live_integration redshift_query_safety_refuses_protected_requests_before_prepare -- --ignored
        
      - name: Run PostgreSQL DDL integration tests
        run: cargo test -p dbflux_driver_postgres --locked --test ddl_integration -- --ignored

      - name: Run PostgreSQL bulk schema columns live integration tests
        run: cargo test -p dbflux_driver_postgres --locked --test schema_columns_live -- --ignored

      - name: Run MySQL live integration tests
        run: cargo test -p dbflux_driver_mysql --locked --test live_integration -- --ignored

      - name: Run MongoDB live integration tests
        run: cargo test -p dbflux_driver_mongodb --locked --test live_integration -- --ignored

      - name: Run Redis live integration tests
        run: cargo test -p dbflux_driver_redis --locked --test live_integration -- --ignored

      # The all-in-one cluster image publishes fixed host ports (7000-7005),
      # so this suite runs single-threaded to avoid two test binaries racing
      # to bind the same ports.
      - name: Run Redis Cluster live integration tests
        run: cargo test -p dbflux_driver_redis --locked --test live_cluster -- --ignored --test-threads=1

      - name: Run Redis RDB analyzer live integration tests
        run: cargo test -p dbflux_driver_redis --locked --test live_rdb -- --ignored

      - name: DynamoDB live integration
        run: cargo test -p dbflux_driver_dynamodb --locked --test live_integration -- --ignored

      - name: Run S3 live integration tests
        run: cargo test -p dbflux_driver_s3 --locked --test live_integration -- --ignored

      - name: Run SQLite live integration tests
        run: cargo test -p dbflux_driver_sqlite --locked --test live_integration

      # MSSQL, InfluxDB, and ClickHouse spin up one container per test (the SQL
      # Server image is ~2 GB), so these suites run single-threaded to avoid
      # exhausting the runner with concurrent containers.
      - name: Run MSSQL live integration tests
        run: cargo test -p dbflux_driver_mssql --locked --test live_integration -- --ignored --test-threads=1

      - name: Run MSSQL query safety collector regression
        run: cargo test -p dbflux_driver_mssql --locked --lib mssql_query_safety_collector_consumes_budget_before_late_error -- --ignored --test-threads=1

      - name: Run MSSQL DDL integration tests
        run: cargo test -p dbflux_driver_mssql --locked --test ddl_integration -- --ignored --test-threads=1

      - name: Run MSSQL instance catalog tests
        run: cargo test -p dbflux_driver_mssql --locked --test instance_catalog -- --ignored --test-threads=1

      - name: Run InfluxDB live integration tests
        run: cargo test -p dbflux_driver_influxdb --locked --test live_integration -- --ignored --test-threads=1

      - name: Run ClickHouse live integration tests
        run: cargo test -p dbflux_driver_clickhouse --locked --test live_integration -- --ignored --test-threads=1

      - name: Run TursoDB live integration tests
        run: cargo test -p dbflux_driver_turso --locked --test live_integration -- --ignored --test-threads=1

      # Each test spins up its own LocalStack container (~1.3 GB image), so
      # this suite runs single-threaded like the MSSQL/InfluxDB/ClickHouse
      # suites above.
      - name: Run CloudWatch live integration tests
        run: cargo test -p dbflux_driver_cloudwatch --locked --test live_integration -- --ignored --test-threads=1

      # Redshift has no Docker-based emulator; these tests hit a real Amazon
      # Redshift cluster and only run when the DBFLUX_TEST_REDSHIFT_* secrets
      # are configured (never true on a fork PR, which gets no secrets), so
      # the step reports a clean skip rather than failing.
      - name: Run Redshift live integration tests
        if: ${{ env.DBFLUX_TEST_REDSHIFT_HOST != '' }}
        env:
          DBFLUX_TEST_REDSHIFT_HOST: ${{ secrets.DBFLUX_TEST_REDSHIFT_HOST }}
          DBFLUX_TEST_REDSHIFT_PORT: ${{ secrets.DBFLUX_TEST_REDSHIFT_PORT }}
          DBFLUX_TEST_REDSHIFT_USER: ${{ secrets.DBFLUX_TEST_REDSHIFT_USER }}
          DBFLUX_TEST_REDSHIFT_PASSWORD: ${{ secrets.DBFLUX_TEST_REDSHIFT_PASSWORD }}
          DBFLUX_TEST_REDSHIFT_DATABASE: ${{ secrets.DBFLUX_TEST_REDSHIFT_DATABASE }}
        run: cargo test -p dbflux_driver_redshift --locked --test live_integration -- --ignored

  # The required contexts here are "Cross-platform check macos-14" and
  # "Cross-platform check windows-latest", one per matrix leg. A job-level
  # scope `if` would prevent matrix expansion entirely, so both contexts would
  # never report; `always()` keeps the matrix expanding even when the `changes`
  # job fails. The job either runs the checks or skips them deliberately on a
  # confirmed docs-only change; it never stops reporting. The expensive steps
  # carry the scope condition; the cheap ones (checkout, toolchain, cache)
  # always run: that is the accepted cost of always-reporting checks.
  cross-platform-check:
    name: Cross-platform check ${{ matrix.os }}
    needs: changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    # GPUI carries a large amount of platform-specific code; a macOS- or
    # Windows-only break otherwise surfaces only when build.yml runs at release
    # or nightly tag time. A lightweight `cargo check` on each platform catches
    # it in the PR instead. Full test execution stays on Linux above.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native arm64; vendored-openssl matches build.yml (the runner has no
          # pkg-config-discoverable OpenSSL, so openssl-sys must build it).
          - os: macos-14
            extra_features: ",vendored-openssl"
          # Native x86_64-msvc; OpenSSL is resolved on the runner as in build.yml.
          - os: windows-latest
            extra_features: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rust-src

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16  # v2
        with:
          # Shared with clippy in style.yml (same features, same target dir).
          shared-key: ci-check-${{ matrix.os }}
          cache-targets: true
          cache-on-failure: true
          # Saved from main only; see the deterministic job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo check
        if: needs.changes.outputs.rust != 'false'
        run: cargo check --workspace --locked --features "sqlite,postgres,mysql,mssql,mongodb,redis,dynamodb,cloudwatch,influxdb,clickhouse,turso,aws,ui-automation${{ matrix.extra_features }}"

      # Compiling the Windows process-containment path (Job Objects) does not prove
      # it reclaims a cancelled hook's process tree, and this is the only job that
      # runs on Windows. Deliberately scoped to the hook module: no other test in
      # the workspace has ever run on Windows, so a broader filter would put
      # unrelated breakage in front of every PR.
      - name: Run hook process containment tests (Windows)
        if: matrix.os == 'windows-latest' && needs.changes.outputs.rust != 'false'
        run: cargo test -p dbflux_core --locked --lib connection::hook
