[workspace]
members = [
    "crates/dbflux",
    "crates/dbflux_app",
    "crates/dbflux_ui",
    "crates/dbflux_ui_base",
    "crates/dbflux_ui_document",
    "crates/dbflux_ui_windows",
    "crates/dbflux_ui_sidebar",
    "crates/dbflux_components",
    "crates/dbflux_core",
    "crates/dbflux_lua",
    "crates/dbflux_ipc",
    "crates/dbflux_driver_ipc",
    "crates/dbflux_test_support",
    "crates/dbflux_driver_sqlite",
    "crates/dbflux_driver_postgres",
    "crates/dbflux_driver_mysql",
    "crates/dbflux_driver_mongodb",
    "crates/dbflux_driver_redis",
    "crates/dbflux_driver_dynamodb",
    "crates/dbflux_driver_cloudwatch",
    "crates/dbflux_driver_mssql",
    "crates/dbflux_driver_redshift",
    "crates/dbflux_driver_clickhouse",
    "crates/dbflux_ssh",
    "crates/dbflux_proxy",
    "crates/dbflux_tunnel_core",
    "crates/dbflux_export",
    "crates/dbflux_transfer",
    "crates/dbflux_driver_host",
    "crates/dbflux_aws",
    "crates/dbflux_ssm",
    "crates/dbflux_mcp",
    "crates/dbflux_mcp_server",
    "crates/dbflux_policy",
    "crates/dbflux_approval",
    "crates/dbflux_audit",
    "crates/dbflux_storage",
    "crates/dbflux_driver_influxdb",
    "crates/dbflux_portability",
    "crates/dbflux_driver_s3",
    "crates/dbflux_i18n",
]
default-members = ["crates/dbflux"]
# The website is not a crate. Excluding it keeps cargo from descending into it
# when resolving paths or packaging.
exclude = ["web"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.8.0-dev.0"
authors = ["Ignacio Perez <ignacio@feuer.me>"]
description = "A fast, keyboard-first database client"
repository = "https://github.com/0xErwin1/dbflux"
homepage = "https://dbflux.dev"
documentation = "https://docs.dbflux.dev/"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dbflux = { path = "crates/dbflux" }
dbflux_core = { path = "crates/dbflux_core" }
dbflux_lua = { path = "crates/dbflux_lua" }
dbflux_test_support = { path = "crates/dbflux_test_support" }
dbflux_driver_sqlite = { path = "crates/dbflux_driver_sqlite" }
dbflux_driver_postgres = { path = "crates/dbflux_driver_postgres" }
dbflux_driver_mysql = { path = "crates/dbflux_driver_mysql" }
dbflux_driver_mongodb = { path = "crates/dbflux_driver_mongodb" }
dbflux_driver_redis = { path = "crates/dbflux_driver_redis" }
dbflux_driver_dynamodb = { path = "crates/dbflux_driver_dynamodb" }
dbflux_driver_cloudwatch = { path = "crates/dbflux_driver_cloudwatch" }
dbflux_driver_mssql = { path = "crates/dbflux_driver_mssql" }
dbflux_driver_redshift = { path = "crates/dbflux_driver_redshift" }
dbflux_driver_clickhouse = { path = "crates/dbflux_driver_clickhouse" }
dbflux_ssh = { path = "crates/dbflux_ssh" }
dbflux_proxy = { path = "crates/dbflux_proxy" }
dbflux_export = { path = "crates/dbflux_export" }
dbflux_ipc = { path = "crates/dbflux_ipc" }
dbflux_driver_ipc = { path = "crates/dbflux_driver_ipc" }
dbflux_aws = { path = "crates/dbflux_aws" }
dbflux_ssm = { path = "crates/dbflux_ssm" }
dbflux_mcp = { path = "crates/dbflux_mcp" }
dbflux_mcp_server = { path = "crates/dbflux_mcp_server" }
dbflux_policy = { path = "crates/dbflux_policy" }
dbflux_approval = { path = "crates/dbflux_approval" }
dbflux_audit = { path = "crates/dbflux_audit" }
dbflux_storage = { path = "crates/dbflux_storage" }
dbflux_driver_influxdb = { path = "crates/dbflux_driver_influxdb" }
dbflux_portability = { path = "crates/dbflux_portability" }
dbflux_driver_s3 = { path = "crates/dbflux_driver_s3" }
dbflux_app = { path = "crates/dbflux_app" }
dbflux_components = { path = "crates/dbflux_components" }
dbflux_ui_base = { path = "crates/dbflux_ui_base" }
dbflux_ui_document = { path = "crates/dbflux_ui_document" }
dbflux_ui_windows = { path = "crates/dbflux_ui_windows" }
dbflux_ui_sidebar = { path = "crates/dbflux_ui_sidebar" }
dbflux_ui = { path = "crates/dbflux_ui" }
dbflux_transfer = { path = "crates/dbflux_transfer" }
dbflux_i18n = { path = "crates/dbflux_i18n" }
mysql = "28"

gpui = "0.2.2"
gpui-component = { version = "0.5.0" }
# Grammars for the code-editor highlighter (gpui-component's highlighter::LanguageRegistry).
# gpui-component's own `tree-sitter-languages` feature pulls in ~30 grammars; DBFlux only
# ever asks the editor for the modes `QueryLanguage::editor_mode()` can return (sql,
# javascript, cypher, lua, python, bash, plaintext) plus json, so those are registered
# individually at startup instead (see dbflux_components::highlighting).
tree-sitter = "0.25.4"
tree-sitter-sequel = "0.3.8"
tree-sitter-javascript = "0.23.1"
tree-sitter-cypher = "0.2.6"
tree-sitter-lua = "0.5.0"
tree-sitter-python = "0.23.6"
tree-sitter-bash = "0.23.3"
tree-sitter-json = "0.24.8"
core-text = ">=21.0.0, <21.1.0"
smallvec = "1.13.2"
rfd = "0.17"
# Raster decoding for object previews. Already in the tree via gpui (which
# decodes `img()` sources with the same crate); the direct dependency only
# exists so previews can validate bytes and read pixel dimensions before
# handing them to the renderer.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
postcard = { version = "1", features = ["use-std"] }
lsp-types = "0.97"
toml = "1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
secrecy = "0.10"
age = { version = "0.11", features = ["armor"] }
dirs = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
# Pinned to match the aes/cbc versions already vendored transitively via
# gpui -> oo7, avoiding a second copy of the RustCrypto block-cipher stack.
aes = "0.8"
cbc = "0.1"
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-log = "0.2"
tracing-appender = "0.2"
fuzzy-matcher = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip", "json"] }
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
base64 = "0.22"
hex = "0.4"
sha2 = "0.11"
interprocess = "2.4"
mlua = "0.11"
flate2 = "1"
zstd = "0.13"
snap = "1"
lz4_flex = "0.14"
rmp-serde = "1.3"
indexmap = "2"
rust-i18n = "3.1"
sqlformat = "0.5.0"
sys-locale = "0.3"
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"

# Development build profile tuned for memory and link speed.
# Full debug info (debug = 2) is the main driver of peak RAM and disk usage
# when linking this many crates; line tables keep backtraces usable at a
# fraction of the cost.
[profile.dev]
debug = "line-tables-only"

# Dependencies rarely need debugging; dropping their debug info entirely is a
# large reduction in target/ size and link-time memory.
[profile.dev.package."*"]
debug = false

# Release build profile tuned for binary size and runtime speed.
# `panic` is intentionally left at the default `unwind`: switching to `abort` is a
# separate decision that loses `catch_unwind` and may break GPUI internals that
# rely on unwinding, so it is not changed here.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
