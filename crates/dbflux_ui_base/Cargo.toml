[package]
name = "dbflux_ui_base"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "App-state-aware UI base layer for DBFlux (AppStateEntity + GPUI event types)"
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
bolt.workspace = true
dbflux_app.workspace = true
dbflux_storage.workspace = true
dbflux_components.workspace = true
dbflux_core.workspace = true
dbflux_i18n.workspace = true
dbflux_mcp = { workspace = true, optional = true }
dbflux_aws = { workspace = true, optional = true }
gpui-mcp = { workspace = true, optional = true }
tracing.workspace = true
uuid.workspace = true
log.workspace = true
anyhow = { workspace = true }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true

# `gpui_linux::restore_child_environment` owns the rule that keeps the Vulkan driver selection
# this process may carry out of the children this crate starts (the system handler a download
# opens). The crate already reaches every GPUI app through `gpui`; declaring it makes the call
# reachable from `open_external`.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.9" }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The keyboard-coverage registry's frame capture lives behind Bolt's
# `test-support` feature, which a plain dependency build does not enable.
bolt = { workspace = true, features = ["test-support"] }
dbflux_components = { workspace = true, features = ["test-support"] }
tempfile = "3"
rusqlite.workspace = true
serde_json.workspace = true

[features]
telemetry = ["dbflux_app/telemetry"]
default = []
test-support = ["gpui/test-support", "bolt/test-support", "dbflux_app/test-support"]
mcp = ["dbflux_mcp", "dbflux_app/mcp"]
lua = ["dbflux_app/lua"]
aws = ["dbflux_aws", "dbflux_app/aws"]
# Installs the gpui-mcp automation bridge in every window. Development only: the
# bridge exposes rendered UI text to local processes of the same user.
ui-automation = ["dep:gpui-mcp"]

[lints]
workspace = true
