[package]
name = "dbflux_ssh"
version.workspace = true
publish = false
edition.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
dbflux_core = { path = "../dbflux_core" }
dbflux_tunnel_core = { path = "../dbflux_tunnel_core" }
dbflux_storage = { path = "../dbflux_storage" }
base64 = { workspace = true }
dirs = { workspace = true }
log = "0.4"
sha2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
ssh2 = "0.9"

# libssh2's WinCNG backend offers only legacy Diffie-Hellman KEX methods,
# which current OpenSSH servers reject. The OpenSSL backend provides the
# Curve25519/ECDH methods needed for a modern SSH handshake.
[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }

[dev-dependencies]
tempfile = "3"

[features]
vendored-openssl = ["ssh2/vendored-openssl"]
