[package]
name = "gpui-mcp-server"
description = "MCP stdio server for GPUI application automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/themixednuts/gpui-mcp"
homepage = "https://github.com/themixednuts/gpui-mcp"
publish = false
# `tests/disabled_state.rs` and `tests/region_capture.rs` drive upstream's
# `examples/demo` application, which is not vendored, so only the self-contained
# test target is built. See vendor/gpui-mcp/VENDOR.md.
autotests = false

[[bin]]
name = "gpui-mcp"
path = "src/main.rs"
doc = false

[[test]]
name = "cache_hints"
path = "tests/cache_hints.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
gpui-mcp-capture = { path = "../gpui-mcp-capture" }
gpui-mcp-protocol = { path = "../gpui-mcp-protocol" }
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
mp4 = "0.14.0"
openh264 = "0.9.7"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3.23.0"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# DBFlux's workspace lint set without `clippy::indexing_slicing`: Cargo cannot
# relax a single inherited lint, so the rest of the root `[workspace.lints]` is
# restated here and must follow it. See vendor/gpui-mcp/VENDOR.md.
[lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
